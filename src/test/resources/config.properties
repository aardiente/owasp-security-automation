
# Browser settings
browser.headless=true
browser.viewport.width=1680
browser.viewport.height=1320
browser.implicitWaitSeconds=0

# Presentation / SlowMo settings
browser.slowMo.enabled=false
browser.slowMo.delayMs=1000
browser.showResultsMs=1000

# Juice Shop ZAP reports
zap.passive.reportName=zap-juiceshop.html
zap.active.reportName=zap-juiceshop-active-findings.html

# Juice Shop active scan (dedicated suite only)
zap.active.enabled=false
zap.active.maxMinutes=20
zap.active.statusOutput=target/security-reports/zap-juiceshop-active.json


# DVWA-only reusable development environment
dvwa.development.reuse=true
dvwa.development.containerName=owasp-dvwa-development
dvwa.development.resetDatabase=false

# DVWA ZAP reports
zap.dvwa.passive.reportName=zap-dvwa.html
zap.dvwa.active.reportName=zap-dvwa-active.html

# DVWA active scan (dedicated suite only)
zap.dvwa.active.maxMinutes=20
zap.dvwa.active.statusOutput=target/security-reports/zap-dvwa-active-status.json

# Lab target defaults (override with JVM -D properties)
juiceshop.image=bkimminich/juice-shop:v20.3.0
juiceshop.port=3000
juiceshop.page.waitSeconds=7
juiceshop.challenges.output=JuiceShopChallengesTest-challenges.json
dvwa.image=vulnerables/web-dvwa:1.9
dvwa.port=80
dvwa.page.waitSeconds=10
dvwa.username=admin
dvwa.password=password

# Workbook location; individual tests support dvwa.*.workbook overrides
test.data.directory=data
dvwa.sqli.workbook=DvwaSqlInjection.xlsx
dvwa.fileUpload.workbook=DvwaFileUpload.xlsx
dvwa.storedXss.workbook=DvwaXssStored.xlsx
dvwa.reflectedXss.workbook=xss_payloads.xlsx

zap.default.reportName=zap-report.html
zap.htmlReportDirectory=target

# HTTP client defaults preserve the original request settings
juiceshop.api.connectSeconds=10
juiceshop.api.requestSeconds=15
juiceshop.api.uploadSeconds=30
juiceshop.api.userAgent=JuiceShopSecurityAutomation/1.0
